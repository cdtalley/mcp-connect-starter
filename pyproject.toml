[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-connect-starter"
version = "0.1.0"
description = "Production-minded MCP server starter: secure, read-only connectors for SQL, a docs/knowledge-base, and a CRM/ticketing system, built on the official MCP Python SDK."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Drake Talley" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "claude",
  "cursor",
  "chatgpt",
  "llm",
  "ai-agents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp[cli]>=1.6.0,<2.0.0",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://prismbase.ai/mcp-connect"
Repository = "https://github.com/cdtalley/mcp-connect-starter"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "httpx>=0.27",
]

[project.scripts]
mcp-connect-starter = "mcp_connect_starter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_connect_starter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_connect_starter"]
