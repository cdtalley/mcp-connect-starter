services:
  mcp-connect-starter:
    build: .
    image: mcp-connect-starter:local
    ports:
      - "8080:8080"
    environment:
      MCP_CONNECT_HTTP_HOST: "0.0.0.0"
      MCP_CONNECT_HTTP_PORT: "8080"
      # Uncomment to narrow scopes for this deployment, e.g. a read-only demo:
      # MCP_CONNECT_GRANTED_SCOPES: "data:read,docs:read,crm:read"
    # Uncomment if you create a .env file from .env.example (see that file
    # for every supported variable, including real-connector credentials):
    # env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
